<!doctype html>
<html>
  <head>
    <title>Oak Stool - Example Furniture</title>
  </head>
  <body>
    <div itemscope itemtype="https://schema.org/Product">
      <h1 itemprop="name">Oak Stool</h1>
      <img itemprop="image" src="/img/stool.jpg" alt="" />
      <p itemprop="description">Solid oak <b>three-legged</b> stool.</p>
      <div itemprop="brand" itemscope itemtype="https://schema.org/Brand">
        <span itemprop="name">Woodshop</span>
      </div>
      <span itemprop="sku">STOOL-OAK</span>
      <div itemprop="offers" itemscope itemtype="https://schema.org/Offer">
        <span itemprop="price" content="89.50">£89.50</span>
        <meta itemprop="priceCurrency" content="GBP" />
        <link itemprop="availability" href="https://schema.org/InStock" />
      </div>
    </div>
  </body>
</html>
