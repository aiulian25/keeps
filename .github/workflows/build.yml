name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These packages were once hidden by a broad ignore rule; fail clearly if they are missing again.
      - name: Check the backup package is in the checkout
        run: git ls-files --error-unmatch internal/backup/archive.go internal/backup/read.go internal/backup/restore.go

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Check formatting
        run: npm run prettier-check

      # The Go embed directive needs the frontend build to exist before vet and test.
      - name: Build frontend
        run: npm --prefix web run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build static linux/amd64 binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o bin/keeps ./cmd/keeps
          file bin/keeps | tee /dev/stderr | grep -q "statically linked"

      - name: Check colour contrast
        run: node scripts/check-contrast.mjs

  browser:
    # The browser journeys against the real binary, on disposable data in
    # this runner only. No live shops, no real instance.
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium

      - name: Browser journeys
        run: npm --prefix web run e2e
        env:
          CI: "1"

      - name: Keep failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
