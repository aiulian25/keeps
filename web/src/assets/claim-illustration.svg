<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A calm living room corner with a bookshelf, plants, a floor lamp and an armchair">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2421"/>
      <stop offset="1" stop-color="#211B19"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B221E"/>
      <stop offset="1" stop-color="#181311"/>
    </linearGradient>
    <radialGradient id="glow" cx="270" cy="470" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0C29C" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#D3B393" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#D3B393" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shadeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E7C69"/>
      <stop offset="1" stop-color="#C9B193"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EBD2AE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#EBD2AE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chairBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A5F58"/>
      <stop offset="1" stop-color="#4B423D"/>
    </linearGradient>
    <linearGradient id="seat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#625750"/>
      <stop offset="1" stop-color="#433B37"/>
    </linearGradient>
    <pattern id="knit" width="12" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 4.5 Q3 0 6 4.5 T12 4.5" fill="none" stroke="#7A6D64" stroke-width="2" opacity="0.6"/>
    </pattern>
    <radialGradient id="vignette" cx="200" cy="420" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <filter id="blurFar" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

  <rect width="400" height="800" fill="url(#wall)"/>
  <rect y="650" width="400" height="150" fill="url(#floor)"/>
  <rect y="646" width="400" height="5" fill="#3A2E28"/>

  <!-- bookshelf (background, slightly soft) -->
  <g filter="url(#soft)">
    <rect x="60" y="30" width="250" height="600" rx="3" fill="#33271F"/>
    <rect x="70" y="40" width="230" height="580" fill="#231A15"/>
    <g fill="#4A382D">
      <rect x="70" y="150" width="230" height="9"/>
      <rect x="70" y="262" width="230" height="9"/>
      <rect x="70" y="374" width="230" height="9"/>
      <rect x="70" y="486" width="230" height="9"/>
    </g>
    <!-- shelf 1 -->
    <rect x="84" y="88" width="14" height="62" fill="#6B5A49"/>
    <rect x="100" y="80" width="11" height="70" fill="#4F433B"/>
    <rect x="113" y="94" width="16" height="56" fill="#8A735D"/>
    <rect x="131" y="86" width="11" height="64" fill="#5A4A3E"/>
    <rect x="220" y="120" width="36" height="30" rx="4" fill="#6E5C4C"/>
    <g fill="#6F7D61">
      <ellipse cx="228" cy="102" rx="7" ry="20" transform="rotate(-30 228 102)"/>
      <ellipse cx="240" cy="94" rx="7" ry="24" transform="rotate(5 240 94)"/>
      <ellipse cx="254" cy="104" rx="7" ry="20" transform="rotate(35 254 104)"/>
    </g>
    <path d="M256 120 q26 16 30 56" fill="none" stroke="#5E6B52" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="284" cy="170" rx="5" ry="11" fill="#5E6B52" transform="rotate(20 284 170)"/>
    <!-- shelf 2 -->
    <rect x="84" y="226" width="68" height="10" fill="#6B5A49"/>
    <rect x="88" y="236" width="62" height="13" fill="#4F433B"/>
    <rect x="86" y="249" width="66" height="13" fill="#7A6652"/>
    <rect x="200" y="200" width="13" height="62" fill="#4A3F38"/>
    <rect x="215" y="192" width="15" height="70" fill="#7A6652"/>
    <rect x="232" y="206" width="11" height="56" fill="#5A4A3E"/>
    <rect x="245" y="198" width="16" height="64" fill="#3F3631"/>
    <rect x="268" y="212" width="11" height="50" fill="#8A735D" transform="rotate(-12 274 262)"/>
    <!-- shelf 3 -->
    <path d="M104 374 q-13 -28 2 -54 h14 q15 26 2 54 z" fill="#8F7D6B"/>
    <rect x="186" y="314" width="13" height="60" fill="#5A4A3E"/>
    <rect x="201" y="306" width="15" height="68" fill="#6B5A49"/>
    <rect x="218" y="320" width="11" height="54" fill="#4A3F38"/>
    <rect x="231" y="312" width="16" height="62" fill="#7A6652"/>
    <rect x="249" y="318" width="13" height="56" fill="#3F3631"/>
    <!-- shelf 4 -->
    <rect x="84" y="428" width="90" height="58" rx="6" fill="#5C4B3D"/>
    <rect x="186" y="428" width="100" height="58" rx="6" fill="#544538"/>
    <g stroke="#3E3229" stroke-width="2" opacity="0.6">
      <line x1="84" y1="448" x2="174" y2="448"/><line x1="84" y1="467" x2="174" y2="467"/>
      <line x1="186" y1="448" x2="286" y2="448"/><line x1="186" y1="467" x2="286" y2="467"/>
    </g>
    <!-- shelf 5 -->
    <rect x="96" y="560" width="70" height="60" rx="5" fill="#4A3B31"/>
    <rect x="190" y="548" width="12" height="72" fill="#5A4A3E"/>
    <rect x="204" y="556" width="15" height="64" fill="#6B5A49"/>
  </g>

  <!-- lamp glow -->
  <rect width="400" height="800" fill="url(#glow)"/>

  <!-- floor lamp -->
  <path d="M220 486 L320 486 L370 690 L170 690 Z" fill="url(#cone)"/>
  <rect x="268" y="484" width="4" height="232" fill="#7E6A55"/>
  <ellipse cx="270" cy="716" rx="34" ry="7" fill="#4F4036"/>
  <path d="M206 486 Q206 414 270 408 Q334 414 334 486 Z" fill="url(#shadeFill)"/>
  <ellipse cx="270" cy="486" rx="64" ry="6" fill="#E8D1AE" opacity="0.8"/>

  <!-- rug -->
  <ellipse cx="180" cy="760" rx="230" ry="36" fill="#2F2622"/>

  <!-- armchair, foreground left -->
  <g>
    <rect x="-40" y="560" width="240" height="160" rx="34" fill="url(#chairBack)"/>
    <rect x="160" y="636" width="58" height="124" rx="24" fill="#564C46"/>
    <rect x="-30" y="668" width="200" height="74" rx="18" fill="url(#seat)"/>
    <rect x="-26" y="736" width="194" height="28" rx="10" fill="#3D3531"/>
    <rect x="176" y="756" width="8" height="30" fill="#2A211D"/>
    <!-- knitted throw over the arm -->
    <path d="M60 566 Q130 556 190 600 L226 736 Q202 758 168 744 L148 650 Q120 616 74 612 Z" fill="#9C8F84"/>
    <path d="M60 566 Q130 556 190 600 L226 736 Q202 758 168 744 L148 650 Q120 616 74 612 Z" fill="url(#knit)"/>
    <path d="M168 744 l-3 14 M180 748 l-2 14 M192 750 l-1 14 M204 748 l0 14 M216 742 l2 14" stroke="#9C8F84" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- foreground plant, left edge, slightly blurred -->
  <g filter="url(#blurFar)" fill="#55624A">
    <ellipse cx="18" cy="250" rx="16" ry="58" transform="rotate(-24 18 250)"/>
    <ellipse cx="40" cy="330" rx="14" ry="50" transform="rotate(18 40 330)"/>
    <ellipse cx="10" cy="400" rx="16" ry="56" transform="rotate(-10 10 400)"/>
    <ellipse cx="36" cy="470" rx="13" ry="46" transform="rotate(26 36 470)"/>
  </g>
  <path d="M8 520 Q24 380 14 200" fill="none" stroke="#45503C" stroke-width="3" filter="url(#blurFar)"/>

  <!-- side table, right edge -->
  <ellipse cx="372" cy="624" rx="46" ry="9" fill="#4A382D"/>
  <rect x="368" y="626" width="7" height="92" fill="#3A2C24"/>
  <rect x="352" y="600" width="16" height="24" rx="3" fill="#8F7D6B"/>

  <rect width="400" height="800" fill="url(#vignette)"/>
</svg>
